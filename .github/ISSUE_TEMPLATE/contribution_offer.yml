name: Contribution Offer
description: Offer to contribute code, translations, art, or other help
title: "[Contribution] "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Want to help out with History Stages? Open this issue first so we can coordinate before you start working.
        This avoids duplicate effort and lets us discuss the approach upfront.

        For small fixes (typos, one-line bugs), feel free to skip this and open a Pull Request directly.

        ---

        **A note on the license:**

        History Stages is **All Rights Reserved** — the source is publicly visible, but the mod is not open source under the OSI definition.
        You are welcome to fork the repository **for the purpose of preparing a pull request**, but forks must not be distributed or published as a standalone mod.

        By submitting a contribution (code, translation, art, etc.), you agree that your contribution is licensed to the project owner (Flix100000) under the project's license terms and may be relicensed as needed.

        See [LICENSE.txt](../LICENSE.txt) for the full terms.

        ---

  - type: dropdown
    id: area
    attributes:
      label: Area of Contribution
      description: What kind of contribution are you offering?
      options:
        - Code (feature / refactor)
        - Code (bug fix)
        - Translation / Localization
        - Documentation / Wiki
        - Art / Textures
        - Testing / QA
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What do you want to work on?
      description: Describe the feature, fix, translation, or other contribution you have in mind.
      placeholder: |
        e.g. "I'd like to add a French translation"
        or "I want to refactor the stage loading code to be async"
        or "I'd like to redesign the Research Pedestal texture"
    validations:
      required: true

  - type: input
    id: related-issue
    attributes:
      label: Related Issue (if any)
      description: Link to an existing issue this contribution would address.
      placeholder: "e.g. #35"
    validations:
      required: false

  - type: dropdown
    id: branch
    attributes:
      label: Target Version / Branch
      description: Which version are you planning to contribute to?
      options:
        - NeoForge 1.21
        - Fabric 1.21
        - Forge 1.20
        - Forge 1.19
        - Not sure / multiple
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Planned Approach (optional)
      description: If you already have an idea of how you want to implement this, share it here so we can discuss before you start.
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: Before you start
      options:
        - label: I understand contributions will be licensed under the project's All Rights Reserved license (see LICENSE.txt) and may be relicensed by the project owner as needed.
          required: true
        - label: I will wait for confirmation before starting significant work to avoid wasted effort.
          required: false
