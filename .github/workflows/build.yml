name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Every compat dependency (Jade, Lootr, the FTB mods, Architectury) comes from
          # cursemaven.com, which rate-limits the shared runner IPs — an uncached run asks for
          # all of them and regularly gets HTTP 429 back. A cache hit never asks at all.
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Compute artifact name
        id: artifact
        run: |
          REF="${{ github.head_ref || github.ref_name }}"
          echo "name=History-Stages-${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/libs/*.jar
