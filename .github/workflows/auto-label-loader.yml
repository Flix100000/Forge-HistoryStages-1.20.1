name: Auto-label loader

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Detect loader from issue body and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const match = body.match(/###\s*Mod Loader\s*\n+\s*(NeoForge|Forge|Fabric)\b/i);
            if (!match) {
              core.info("No 'Mod Loader' field found in issue body — skipping.");
              return;
            }

            const loader = match[1].toLowerCase();
            const desiredLabel = `loader:${loader}`;
            const managedLabels = ["loader:neoforge", "loader:forge", "loader:fabric"];

            const current = context.payload.issue.labels.map(l => l.name);
            const toRemove = managedLabels.filter(l => l !== desiredLabel && current.includes(l));

            for (const name of toRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (err) {
                core.info(`Could not remove label ${name}: ${err.message}`);
              }
            }

            if (!current.includes(desiredLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [desiredLabel],
              });
              core.info(`Added label ${desiredLabel}`);
            } else {
              core.info(`Label ${desiredLabel} already present.`);
            }
