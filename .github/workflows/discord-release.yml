name: Discord Release Notification

on:
  release:
    types: [published]
  # Manual trigger to test the webhook wiring without an actual release
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Title of the test message'
        required: false
        default: 'Test Release'
      release_body:
        description: 'Body of the test message'
        required: false
        default: 'Test message to verify the Discord webhook.'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # Derive loader + Minecraft version from the branch
      # (e.g. neoforge-1.21.X -> "NeoForge 1.21", forge-1.20.X -> "Forge 1.20").
      # On a real release this is the target branch, on a test the current branch.
      - name: Determine Minecraft version from branch
        id: mcver
        run: |
          BRANCH="${{ github.event.release.target_commitish }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.ref_name }}"
          fi
          MC=$(echo "$BRANCH" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          case "$BRANCH" in
            neoforge*) LOADER="NeoForge" ;;
            forge*)    LOADER="Forge" ;;
            fabric*)   LOADER="Fabric" ;;
            *)         LOADER="" ;;
          esac
          FOOTER=$(echo "$LOADER $MC" | sed 's/^ *//;s/ *$//')
          echo "footer=$FOOTER" >> "$GITHUB_OUTPUT"

      - name: Post release to Discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          color: '5793266'
          # Notification text above the embed, pings everyone in the channel.
          content: '@everyone 🎉 A new update is available!'
          # Footer shows loader + MC version, timestamp = release date.
          footer_title: ${{ steps.mcver.outputs.footer }}
          footer_timestamp: true
          # On workflow_dispatch these inputs are used;
          # on a real release the action reads github.event.release automatically.
          release_name: ${{ github.event.inputs.release_name }}
          release_body: ${{ github.event.inputs.release_body }}
