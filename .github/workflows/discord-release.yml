name: Discord Release Notification

on:
  release:
    types: [published]
  # Manual trigger to test the webhook wiring without an actual release
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Title of the test message'
        required: false
        default: 'History Stages 5.5.0'
      release_body:
        description: 'Body of the test message'
        required: false
        default: "### Added\n- Research pedestals & scrolls\n\n### Fixed\n- Loot strip on individual stages"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # Derive loader + Minecraft version from the branch
      # (e.g. neoforge-1.21.X -> loader "NeoForge", mc "1.21").
      # On a real release this is the target branch, on a test the current branch.
      - name: Determine loader and Minecraft version
        id: mcver
        run: |
          BRANCH="${{ github.event.release.target_commitish }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.ref_name }}"
          fi
          MC=$(echo "$BRANCH" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          case "$BRANCH" in
            neoforge*) LOADER="NeoForge" ;;
            forge*)    LOADER="Forge" ;;
            fabric*)   LOADER="Fabric" ;;
            *)         LOADER="" ;;
          esac
          FOOTER=$(echo "History Stages • $LOADER $MC" | sed 's/  */ /g;s/ *$//')
          {
            echo "loader=${LOADER:-—}"
            echo "mc=${MC:-—}"
            echo "footer=$FOOTER"
          } >> "$GITHUB_OUTPUT"

      # Build the embed payload manually so we can use author, thumbnail,
      # fields and a footer icon (the ready-made action can't do those).
      - name: Post release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.inputs.release_name || github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body || github.event.inputs.release_body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          ICON_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/src/main/resources/assets/historystages/icon.png
          LOADER: ${{ steps.mcver.outputs.loader }}
          MC: ${{ steps.mcver.outputs.mc }}
          FOOTER: ${{ steps.mcver.outputs.footer }}
        run: |
          set -euo pipefail

          # Fallbacks for the manual test run (no real release payload)
          RELEASE_URL="${RELEASE_URL:-https://github.com/${{ github.repository }}/releases}"
          PUBLISHED_AT="${PUBLISHED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          RELEASE_NAME="${RELEASE_NAME:-New release}"
          RELEASE_BODY="${RELEASE_BODY:-No changelog provided.}"

          # Discord embed description caps at 4096 characters
          RELEASE_BODY=$(printf '%s' "$RELEASE_BODY" | head -c 4000)

          MODRINTH_URL="https://modrinth.com/mod/history-stages"
          CURSEFORGE_URL="https://www.curseforge.com/minecraft/mc-mods/history-stages"
          DOWNLOADS="[Modrinth]($MODRINTH_URL) • [CurseForge]($CURSEFORGE_URL) • [GitHub]($RELEASE_URL)"

          payload=$(jq -n \
            --arg content $'@everyone\n🚀 **A new version is available!**' \
            --arg title "🚀 $RELEASE_NAME" \
            --arg url "$RELEASE_URL" \
            --arg desc "$RELEASE_BODY" \
            --arg loader "$LOADER" \
            --arg mc "$MC" \
            --arg downloads "$DOWNLOADS" \
            --arg icon "$ICON_URL" \
            --arg footer "$FOOTER" \
            --arg ts "$PUBLISHED_AT" \
            '{
              username: "History Stages",
              avatar_url: $icon,
              content: $content,
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                author: { name: "History Stages", icon_url: $icon },
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                thumbnail: { url: $icon },
                fields: [
                  { name: "🧩 Loader", value: $loader, inline: true },
                  { name: "🎯 Minecraft", value: $mc, inline: true },
                  { name: "📥 Download", value: $downloads, inline: false }
                ],
                footer: { text: $footer, icon_url: $icon },
                timestamp: $ts
              }]
            }')

          curl -sSf -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
