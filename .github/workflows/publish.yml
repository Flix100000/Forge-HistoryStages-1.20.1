name: Publish Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # CurseForge
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Modrinth (entfernen falls nicht genutzt)
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Mod-Details
          name: History Stages ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          game-versions: |
            1.20
            1.20.1
          loaders: forge
          version-type: release
          dependencies: |
            lootr(required)
            jei(optional)
            emi(optional)
            jade(optional)
          java: 17
          files: build/libs/!(*-sources).jar

      - name: Upload jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/!(*-sources).jar

  # Announce on Discord only after the build + publish succeeded
  notify:
    needs: publish
    uses: ./.github/workflows/discord-notify.yml
    with:
      release_name: ${{ github.event.release.name || github.event.release.tag_name }}
      release_body: ${{ github.event.release.body }}
      release_url: ${{ github.event.release.html_url }}
      published_at: ${{ github.event.release.published_at }}
      ref: ${{ github.event.release.target_commitish }}
    secrets:
      webhook: ${{ secrets.DISCORD_WEBHOOK }}
