plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Jared's Maven"
        url "https://maven.blamejared.com"
    }
    maven {
        name = "TerraformersMC"
        url "https://maven.terraformersmc.com/"
    }
    maven {
        name = "FTB Mods"
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        name = "Architectury"
        url "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "Curios"
        url "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Wisp Forest"
        url "https://maven.wispforest.io/releases"
    }
    maven {
        name = "Sinytra"
        url "https://maven.su5ed.dev/releases"
    }
    maven {
        // KubeJS pulls animated-gif-lib-for-java at runtime and it lives nowhere but JitPack.
        // Scoped to that one group so nothing else starts resolving from here by accident.
        name = "JitPack"
        url "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "KubeJS"
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        name = "Modrinth"
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Adds the stand-in addon category so the addon path can be exercised in the dev
            // client. Nothing ships with it: without this property the demo never registers.
            systemProperty 'historystages.demoCategory', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Its own directory, or the server and a client cannot run at the same time — which is
            // the entire point of a dedicated-server test. The client keeps run/ and the test data
            // sitting in it.
            gameDirectory = project.file('run-server')

            // The same stand-in addon the client gets. Without it the server never registers the
            // demo category or requirement, so an addon's data crossing the wire — the thing most
            // likely to break on a server — could not be tested at all.
            systemProperty 'historystages.demoCategory', 'true'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Its own directory as well, or an automated run collides with both of the above.
            gameDirectory = project.file('run-gametest')

            // The demo addon takes part in the tests, so the server has to know it.
            systemProperty 'historystages.demoCategory', 'true'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"
    implementation "curse.maven:lootr-361276:8695784"

    // JEI for MC 1.21.1 NeoForge. The 1.21 artifacts stop at 19.8.2.99; everything newer is
    // published under the 1.21.1 id, which is the version this mod builds against anyway.
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.51.0.417"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.51.0.417"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.51.0.417"

    // EMI for MC 1.21.1 NeoForge
    compileOnly "dev.emi:emi-neoforge:1.1.24+1.21.1:api"
    //localRuntime "dev.emi:emi-neoforge:1.1.24+1.21.1"

    // Jade
    implementation "curse.maven:jade-324717:8591319"

    // FTB Quests (optional integration) — targets MC 1.21.1 (2101.x). FTBQuests for MC 1.21 (2100.x) never left beta and has broken tooltips for custom tasks/rewards.
    implementation "curse.maven:ftb-library-forge-404465:8569579"
    implementation "curse.maven:ftb-teams-forge-404468:8724782"
    implementation "curse.maven:ftb-quests-forge-289412:8730556"
    implementation "curse.maven:architectury-api-419699:8492726"

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    // Accessories
    compileOnly "io.wispforest:accessories-neoforge:1.1.0-beta.53+1.21.1"

    // Spell Engine API (optional integration — adapter only loads when the mod is present at runtime)
    compileOnly "maven.modrinth:spell-engine:1.10.4+1.21.1-neoforge"

    // KubeJS (optional integration). The bridge is reached only because KubeJS reads
    // kubejs.plugins.txt, so nothing here is a hard dependency. localRuntime as well as
    // compileOnly, or the integration could not be exercised in the dev client at all.
    compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.374"
    localRuntime "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.374"

    // CraftTweaker (optional integration). Found the same way: CraftTweaker scans for
    // @ZenRegister, nothing in this mod references the bridge classes.
    compileOnly "com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:21.0.38"
    localRuntime "com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:21.0.38"

    // Create, for exercising the fluid side of the recipe picker by hand. Nothing in this mod
    // references Create: the fluid scanner reads a recipe's serialised form and names no mod, so
    // this is a test subject rather than an integration. localRuntime keeps it out of the
    // published jar entirely.
    //
    // The NeoForge build carries Flywheel, Ponder and Registrate inside its own jar, so they need
    // no entries of their own. If the dev client ever reports one of them missing, jar-in-jar did
    // not unpack and these are the coordinates:
    //   localRuntime "maven.modrinth:flywheel:1.0.6+mc1.21.1-neoforge"
    //   localRuntime "maven.modrinth:ponder:1.0.82+mc1.21.1-neoforge"
    //   localRuntime "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
    localRuntime "maven.modrinth:create:6.0.10+mc1.21.1"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The moddev plugin does not wire the Minecraft/NeoForge runtime classpath (which bundles
    // Gson) into the test source set, so unit tests that touch Gson directly need their own copy.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    // The lock benchmark is an instrument, not a test: half a million iterations per
    // measurement turn a three-second suite into thirty-five, and the suite runs after every
    // step of a refactor. Off by default, on with `./gradlew test -Pbench`.
    systemProperty 'historystages.bench', project.hasProperty('bench') ? 'true' : 'false'
}